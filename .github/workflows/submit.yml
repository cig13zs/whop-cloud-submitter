name: whop-submit
on:
  schedule:
    # GitHub often delays or drops a single cron (observed gaps of 4-6 h). Three offset 5-minute schedules
    # are the backstop. The laptop-closed primary is whop-loop (loop.yml), which workflow_dispatch-es this
    # file every 5 minutes. whop-submit concurrency queues overlaps. Minutes are free on this public repo.
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the secrets and print the plan; publish and submit nothing'
        type: boolean
        default: false
      probe:
        description: 'Dry run only: comma-separated TikTok/Instagram post URLs to check from the runner'
        type: string
        default: ''
      ig_probe:
        description: 'Dry run only: ig-media asset name to upload as a never-published Reel container'
        type: string
        default: ''
      video_ids:
        description: 'Register clips: comma-separated VIDEOID or VIDEOID=CAMPAIGN-UUID. Send at schedule time; a private one is watched and submitted when it goes public'
        type: string
        default: ''
# No pull_request trigger on purpose: forks can never run this with the secrets. workflow_dispatch needs write access.
concurrency:
  group: whop-submit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pass:
    # The cron only runs once the repo variable CLOUD_ON is "true" (go-live switch; a skipped job bills nothing).
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_ON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned: this runner holds the secrets
        with:
          # Default checkout pins github.sha. A run queued on whop-submit must seal from the branch tip.
          ref: ${{ github.ref }}
      - name: Decrypt the queue and state
        run: node crypt.mjs open
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - name: Merge one-shot channel-map override
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          DRY: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ ! -f channel-map.override.json ]; then exit 0; fi
          node map-edit.mjs resolve-file channel-map.override.json before || true
          if ! node map-edit.mjs apply-file channel-map.override.json; then
            echo "map apply failed; submissions continue on the previous map"
            exit 0
          fi
          node map-edit.mjs resolve-file channel-map.override.json after || true
          if [ "$DRY" = "true" ]; then exit 0; fi
          node map-edit.mjs register channel-map.override.json || echo "register failed; feed path still submits mapped channels"
          touch /tmp/map-applied
      - name: Publish due clips and submit them
        run: node run.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          WHOP_CR_COOKIE: ${{ secrets.WHOP_CR_COOKIE }}
          YT_CLIENT: ${{ secrets.YT_CLIENT }}
          YT_REFRESH_TOKENS: ${{ secrets.YT_REFRESH_TOKENS }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PROBE: ${{ inputs.dry_run && inputs.probe || '' }}
          IG_PROBE: ${{ inputs.dry_run && inputs.ig_probe || '' }}
          # video_ids is not passed here on purpose: run.mjs reads it from the event file, so campaign ids never print.
      - name: Real miss only (public more than 25 min and still unsubmitted)
        if: always() && !inputs.dry_run
        env:
          # Optional. ISO instant: repost-queue clips public before this are not emailed again. New misses still exit 2.
          SKIP_OLD_MISSES_BEFORE: ${{ vars.SKIP_OLD_MISSES_BEFORE }}
        run: node guard/watchdog.mjs queue.json state.json guard-out
      - name: Commit state.json.enc
        if: always() && !inputs.dry_run
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          node crypt.mjs seal state.json
          if [ -f /tmp/map-applied ]; then node crypt.mjs seal channel-map.json; fi
          git add -- channel-map.json.enc state.json.enc
          if [ -f /tmp/map-applied ]; then git rm -q --ignore-unmatch channel-map.override.json; fi
          if git diff --cached --name-only --diff-filter=A | grep -E '\.json$'; then echo "refusing to commit plaintext json"; exit 1; fi
          git diff --cached --quiet && exit 0
          git config user.name whop-cloud
          git config user.email whop-cloud@users.noreply.github.com
          msg="state $(date -u +%FT%TZ)"
          if [ -f /tmp/map-applied ]; then msg="$msg; map lrnsdc channels (FROM-GROK 014)"; fi
          git commit -q -m "$msg"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
  readback:
    needs: pass
    if: always() && (needs.pass.result == 'success' || needs.pass.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          ref: ${{ github.sha }}
      - name: Print channel and video campaign ids
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          if [ ! -f channel-map.override.json ]; then echo "no override; read-back skipped"; exit 0; fi
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          git checkout FETCH_HEAD -- channel-map.json.enc
          node crypt.mjs open
          node map-edit.mjs resolve-file channel-map.override.json readback
          rm -f channel-map.json queue.json state.json laptop-state.json
